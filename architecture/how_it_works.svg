<svg viewBox="0 0 1100 1411" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<rect x="0" y="0" width="1100" height="1411" fill="#ffffff"/>

<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
  </marker>
</defs>

<text x="550.0" y="46" text-anchor="middle" font-size="25" font-weight="800" fill="#111827">Diabetic Retinopathy Detector — How It's Built</text>
<text x="550.0" y="70" text-anchor="middle" font-size="13.5" fill="#6b7280">Trains once on Kaggle's free GPU, then two separate local tools use the resulting weights to make predictions</text>
<text x="550.0" y="90" text-anchor="middle" font-size="11.5" fill="#9ca3af">(pill under each box = the source file that does it)</text>
<text x="90" y="118" font-size="13" font-weight="800" letter-spacing="1.1" fill="#a16207" font-family="Helvetica,Arial,sans-serif">PHASE A — TRAINING (KAGGLE, FREE GPU, RUN OCCASIONALLY)</text>
<rect x="90" y="142" width="940" height="142" rx="12" fill="#fef9c3" stroke="#a16207" stroke-width="1.8"/>
<text x="560.0" y="173" text-anchor="middle" font-size="17" font-weight="700" fill="#713f12" font-family="Helvetica,Arial,sans-serif">Loads and balances two public datasets, then applies the same contrast-boosting preprocessing</text>
<text x="560.0" y="195" text-anchor="middle" font-size="17" font-weight="700" fill="#713f12" font-family="Helvetica,Arial,sans-serif">to every image</text>
<text x="560.0" y="220" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">Combines APTOS 2019 and EyePACS 2015 — EyePACS is capped at 2,000 images per class so it doesn't drown out the smaller APTOS set</text>
<rect x="327.9" y="233" width="464.2" height="26" rx="10" fill="#ffffff" stroke="#a16207" stroke-width="1.2" opacity="0.9"/>
<text x="560.0" y="248" text-anchor="middle" font-size="11.5" fill="#a16207" font-family="Menlo,Consolas,monospace" font-weight="600">train.py → load_aptos() + load_eyepacs() + ben_graham_processing()</text>
<line x1="550.0" y1="284" x2="550.0" y2="324" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="90" y="324" width="940" height="138" rx="12" fill="#fef9c3" stroke="#a16207" stroke-width="1.8"/>
<text x="560.0" y="355" text-anchor="middle" font-size="17" font-weight="700" fill="#713f12" font-family="Helvetica,Arial,sans-serif">Trains a ConvNeXt-Tiny model 5 separate times (5-fold cross-validation), 10 epochs each</text>
<text x="560.0" y="380" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">Mixed-precision training, different learning rates for the backbone vs. the classifier head, and class-weighted loss to handle the</text>
<text x="560.0" y="398" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">imbalanced grades. Saves the best checkpoint for each fold whenever its kappa score improves.</text>
<rect x="401.6" y="411" width="316.8" height="26" rx="10" fill="#ffffff" stroke="#a16207" stroke-width="1.2" opacity="0.9"/>
<text x="560.0" y="426" text-anchor="middle" font-size="11.5" fill="#a16207" font-family="Menlo,Consolas,monospace" font-weight="600">train.py → best_fold0.pth ... best_fold4.pth</text>
<line x1="550.0" y1="462" x2="550.0" y2="502" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="90" y="502" width="940" height="160" rx="12" fill="#fef9c3" stroke="#a16207" stroke-width="1.8"/>
<text x="560.0" y="533" text-anchor="middle" font-size="17" font-weight="700" fill="#713f12" font-family="Helvetica,Arial,sans-serif">Runs a final out-of-fold evaluation with test-time augmentation to get one honest ensemble</text>
<text x="560.0" y="555" text-anchor="middle" font-size="17" font-weight="700" fill="#713f12" font-family="Helvetica,Arial,sans-serif">score</text>
<text x="560.0" y="580" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">Each fold's model only predicts on the data it never saw during training — giving a realistic estimate of real-world accuracy</text>
<text x="560.0" y="598" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">(quadratic-weighted kappa)</text>
<rect x="445.15" y="611" width="229.70000000000002" height="26" rx="10" fill="#ffffff" stroke="#a16207" stroke-width="1.2" opacity="0.9"/>
<text x="560.0" y="626" text-anchor="middle" font-size="11.5" fill="#a16207" font-family="Menlo,Consolas,monospace" font-weight="600">train.py → final ensemble kappa</text>
<line x1="90" y1="692" x2="1010" y2="692" stroke="#e5e7eb" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="550.0" y="712" text-anchor="middle" font-size="12" fill="#9ca3af" font-family="Helvetica,Arial,sans-serif">The 5 .pth files above are downloaded from Kaggle and dropped into a local weights/ folder — everything below runs on a normal computer, no GPU needed</text>
<text x="90" y="752" font-size="13" font-weight="800" letter-spacing="1.1" fill="#1d4ed8" font-family="Helvetica,Arial,sans-serif">PHASE B — LOCAL INFERENCE: TWO TOOLS IN THE REPO, SAME CORE APPROACH</text>
<rect x="90" y="776" width="940" height="70" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="560.0" y="805" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a" font-family="Helvetica,Arial,sans-serif">Both tools reuse the exact same preprocessing, and both average predictions across all 5 fold models with</text>
<text x="560.0" y="825" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a" font-family="Helvetica,Arial,sans-serif">4-step test-time augmentation (original + 3 flips) before deciding on a grade</text>
<line x1="550.0" y1="846" x2="550.0" y2="886" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="85.0" y="886" width="450" height="137" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
<text x="310.0" y="916" text-anchor="middle" font-size="16" font-weight="700" fill="#0c4a6e" font-family="Helvetica,Arial,sans-serif">inference.py — the simple version</text>
<text x="310.0" y="940" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">Runs on GPU if available, otherwise CPU. Prints a plain</text>
<text x="310.0" y="958" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">results table and saves one CSV. No extras.</text>
<rect x="258.8" y="971" width="102.4" height="26" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="1.2" opacity="0.9"/>
<text x="310.0" y="986" text-anchor="middle" font-size="11.5" fill="#0369a1" font-family="Menlo,Consolas,monospace" font-weight="600">inference.py</text>
<rect x="565.0" y="886" width="450" height="191" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
<text x="790.0" y="916" text-anchor="middle" font-size="16" font-weight="700" fill="#0c4a6e" font-family="Helvetica,Arial,sans-serif">infer2.py — the clinical version</text>
<text x="790.0" y="940" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">CPU-only. Adds: flags any prediction under 60% confidence as</text>
<text x="790.0" y="958" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">“needs manual review,” generates a Grad-CAM heatmap per</text>
<text x="790.0" y="976" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">image, prints stage/meaning/recommended-action per grade,</text>
<text x="790.0" y="994" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">and saves every run into its own timestamped folder so</text>
<text x="790.0" y="1012" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">nothing gets overwritten</text>
<rect x="748.85" y="1025" width="82.30000000000001" height="26" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="1.2" opacity="0.9"/>
<text x="790.0" y="1040" text-anchor="middle" font-size="11.5" fill="#0369a1" font-family="Menlo,Consolas,monospace" font-weight="600">infer2.py</text>
<line x1="90" y1="1127" x2="1010" y2="1127" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,5"/>
<text x="220" y="1167" font-size="13" font-weight="800" letter-spacing="1.1" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">NOT PART OF THE PIPELINE — A STANDALONE TOOL, RUN ANYTIME</text>
<rect x="220" y="1191" width="600" height="160" rx="12" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.8"/>
<text x="520.0" y="1222" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">Opens any .pth file and prints its layer names, shapes,</text>
<text x="520.0" y="1244" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">and total parameter count</text>
<text x="520.0" y="1269" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">Purely a debugging tool for checking a weight file is intact and sane — doesn't</text>
<text x="520.0" y="1287" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">touch images or make predictions</text>
<rect x="448.7" y="1300" width="142.60000000000002" height="26" rx="10" fill="#ffffff" stroke="#4b5563" stroke-width="1.2" opacity="0.9"/>
<text x="520.0" y="1315" text-anchor="middle" font-size="11.5" fill="#4b5563" font-family="Menlo,Consolas,monospace" font-weight="600">inspect_weights.py</text>
</svg>